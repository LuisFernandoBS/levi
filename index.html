<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levi Baby Shower</title>
<meta name="theme-color" content="#123B56">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.jpg">
<link rel="apple-touch-icon" href="/icons/icon-192.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#123B56;--tq:#42BFC1;--pa:#A8DFE8;--ag:#B5E5D6;--sand:#F4E8D0;--co:#F3A69B;--lv:#C9BDEB;--ink:#123B56;--mut:#5E7F8E;--bg:#EEF8F8;--card:#fff;--ln:#D8ECEE;--r:22px;--sh:0 6px 20px rgba(18,59,86,.08)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 'DM Sans',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#E6F6F6,#F3FAF9 40%,#EAF6F3);-webkit-tap-highlight-color:transparent}
h1,h2,h3,.h{font-family:'Baloo 2','DM Sans',sans-serif;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
#bub{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bub i{position:absolute;bottom:-30px;border-radius:50%;border:1.5px solid rgba(66,191,193,.45);background:radial-gradient(circle at 30% 30%,#fff9,#A8DFE822);animation:up linear infinite}
@keyframes up{to{transform:translateY(-110vh) translateX(20px)}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(#EAF7F7 70%,#EAF7F700)}
header.top h2{font-size:22px}
.av{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#F9C9C0,var(--co));display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(145deg,#123B56,#1A7482);color:#fff;border-radius:28px;padding:22px;position:relative;overflow:hidden;margin-bottom:18px;min-height:250px}
.hero h1{font-size:32px;max-width:11ch;margin:6px 0 10px}
.pill{display:inline-block;background:#ffffff22;border-radius:999px;padding:5px 12px;font-size:12px}
.hero .octopus{position:absolute;right:-6px;bottom:-12px;width:190px;height:220px;object-fit:contain;animation:swim 5s ease-in-out infinite}
@keyframes swim{50%{transform:translate(-8px,-8px) rotate(-2deg)}}
.bar{height:7px;border-radius:9px;background:#ffffff33;overflow:hidden}.bar.d{background:#E1F0F0}
.bar b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--tq),var(--ag));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid .card{margin:0;padding:14px}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-bottom:8px}
.ic img{width:100%;height:100%;object-fit:contain}
.n{font:800 22px 'Baloo 2';letter-spacing:-.3px}.sm{font-size:12px;color:var(--mut)}
.sec{font:700 11px 'DM Sans';color:var(--tq);margin:18px 0 2px;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row>div:nth-child(2){flex:1;min-width:0}.row b{display:block}
.row-actions{display:flex;gap:6px;flex:none}
.icon-btn{width:36px;height:36px;border-radius:11px;background:#E8F3F3;color:var(--deep);font-size:16px}
.icon-btn.danger{background:#FDE5E1;color:#C4574A}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.ingredient-edit{display:grid;grid-template-columns:1.2fr 1fr .8fr 36px;gap:6px;align-items:center}
.ingredient-edit .inp{min-width:0;padding:10px 8px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;flex:none;color:#fff;font-size:13px}.chk.on{background:var(--tq);border-color:var(--tq)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin:6px 0 14px}
.tabs button{flex:1;padding:10px 4px;color:var(--mut);font-weight:700;border-bottom:3px solid transparent}.tabs .on{color:var(--deep);border-color:var(--tq)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--ln);color:var(--mut);font-weight:500}.chip.on{background:var(--ag);color:var(--deep);border-color:var(--ag)}
.btn{background:var(--deep);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.96)}.btn:hover{box-shadow:0 6px 16px rgba(18,59,86,.25)}.btn.s{background:#E8F3F3;color:var(--deep)}
.fab{width:46px;height:46px;border-radius:15px;background:var(--deep);color:#fff;font-size:24px}
.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--ln);background:#fff;margin:5px 0 12px}.inp:focus{border-color:var(--tq);outline:0}
label{font-size:12px;font-weight:700;color:var(--mut)}
.srch{display:flex;gap:8px;margin-bottom:10px}.srch .inp{margin:0;flex:1}
.badge{font-size:11px;font-weight:700;border-radius:8px;padding:3px 9px;background:#E3F5F2;color:#1F8F8A}.badge.r{background:#FDE5E1;color:#C4574A}.badge.y{background:#FBF0D3;color:#A07A1E}.badge.l{background:#EDE8FA;color:#6B56B0}
.dt{width:46px;height:46px;border-radius:13px;background:#FDE5E1;color:#C4574A;text-align:center;font:800 17px/1 'Baloo 2';padding-top:6px;flex:none}.dt small{display:block;font:700 9px 'DM Sans'}
.tip{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#DDF3EE,#E8E5F8)}
.rec{padding:0;overflow:hidden}.rec .top{height:84px;background:linear-gradient(135deg,var(--ag),#DFF3EF);display:grid;place-items:center;font-size:38px;position:relative}
.rec .top span{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;background:#fff;border-radius:8px;padding:3px 9px}
.rec .bd{padding:14px 16px}.ings{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}.ings.open{grid-template-rows:1fr}.ings>div{overflow:hidden}
.tl{position:relative;padding-left:34px}.tl div{position:relative;padding-bottom:18px}.tl div:before{content:'✓';position:absolute;left:-34px;top:0;width:24px;height:24px;border-radius:50%;background:var(--tq);color:#fff;display:grid;place-items:center;font-size:12px}.tl div.w:before{content:'';background:#fff;border:2px solid var(--ln)}
.tl div:after{content:'';position:absolute;left:-22px;top:24px;bottom:0;width:2px;background:var(--tq)}.tl div:last-child:after{display:none}.tl div.w:after{background:var(--ln)}
.donut{width:96px;height:96px;flex:none}.donut circle{fill:none;stroke-width:11;transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.bl{background:linear-gradient(145deg,#123B56,#1A7482);color:#fff}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));background:#ffffffee;backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 8px 30px rgba(18,59,86,.18);display:flex;padding:6px;z-index:10}
nav button{flex:1;padding:8px 2px;border-radius:18px;font-size:10px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .2s}nav button span{font-size:19px}
nav button .nav-icon{width:26px;height:26px;object-fit:contain}
.page-art{width:100%;height:100%;object-fit:contain}
.budget-visual{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.budget-visual img{width:90px;height:100px;object-fit:contain}
.budget-visual .donut{width:76px;height:76px}
nav button.on{background:#DDF3F0;color:var(--tq)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:46vh}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;background:#fff;box-shadow:var(--sh);align-self:flex-start;white-space:pre-wrap}.msg.u{align-self:flex-end;background:var(--deep);color:#fff}
.ac{background:#EDE8FA;border-radius:16px;padding:12px;align-self:flex-start;max-width:92%}
.cbar{position:sticky;bottom:92px;display:flex;gap:8px;background:#EAF7F7;padding:8px 0}.cbar .inp{margin:0;flex:1}
.mask{position:fixed;inset:0;background:#123B5688;backdrop-filter:blur(3px);z-index:20;display:grid;align-items:end;animation:fd .2s}
.sheet{background:#fff;border-radius:28px 28px 0 0;padding:20px;max-width:560px;width:100%;margin:0 auto;max-height:92vh;overflow:auto;animation:sl .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fd{from{opacity:0}}@keyframes sl{from{transform:translateY(60px);opacity:0}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);background:var(--deep);color:#fff;padding:11px 18px;border-radius:16px;z-index:40;transition:transform .35s;box-shadow:var(--sh)}#toast.show{transform:translate(-50%,0)}
.cf{position:fixed;width:9px;height:9px;border-radius:50%;z-index:50;pointer-events:none;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y));opacity:0}}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#42BFC1,#1A7482 50%,#123B56);display:grid;place-content:center;text-align:center;color:#fff;transition:opacity .6s .1s}
#splash.out{opacity:0;pointer-events:none}#splash img{width:250px;height:270px;object-fit:contain;margin:auto;animation:swim 4s ease-in-out infinite}#splash h1{font-size:68px;margin-top:6px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}.empty svg{width:120px}
.sk{height:60px;border-radius:16px;background:linear-gradient(90deg,#E3F1F1,#F4FAFA,#E3F1F1);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}
@media(min-width:900px){#app{max-width:880px;padding-left:230px}nav{left:16px;top:16px;bottom:16px;transform:none;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 10px}nav button{flex:none;flex-direction:row;font-size:14px;gap:12px;padding:12px 14px}.cbar{bottom:0}.grid{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#bub{display:none}}
</style>
</head>
<body>
<div id="bub" aria-hidden="true"></div>
<div id="splash"><img src="/icons/octopus-loading.png" alt="Polvo esperando com uma ampulheta"><h1 class="h">Levi</h1><p>Uma aventura está chegando...</p></div>
<div id="app"><header class="top"><h2 id="ttl">Início</h2><div id="user-actions" style="display:flex;gap:8px;align-items:center"><button class="av" style="background:#fff" aria-label="Notificações" onclick="toast('Sem alertas novos 🌊')">🔔</button><button class="av" aria-label="Sair" title="Sair" onclick="logout()">M</button></div></header><main id="v"></main></div>
<nav id="nav" aria-label="Navegação principal"></nav>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const R=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* ---------- Personagens (SVG) ---------- */
const TURTLE=`<svg viewBox="0 0 200 140" aria-label="Tartaruga Levi"><ellipse cx="100" cy="128" rx="64" ry="7" fill="#12384f1a"/><ellipse cx="62" cy="108" rx="16" ry="9" fill="#7FD6C9" stroke="#123B56" stroke-width="4"/><ellipse cx="126" cy="108" rx="16" ry="9" fill="#7FD6C9" stroke="#123B56" stroke-width="4"/><path d="M26 98c0-40 30-66 66-66s62 26 62 66z" fill="#B5E5D6" stroke="#123B56" stroke-width="5"/><path d="M92 34v62M60 52l32 20 32-20M46 90l46-18 46 18" fill="none" stroke="#42BFC1" stroke-width="4" stroke-linejoin="round"/><path d="M92 46l22 14-8 24H78l-8-24z" fill="#42BFC1" opacity=".55"/><ellipse cx="156" cy="74" rx="30" ry="27" fill="#7FD6C9" stroke="#123B56" stroke-width="5"/><circle cx="162" cy="68" r="10" fill="#fff" stroke="#123B56" stroke-width="3"/><circle cx="164" cy="68" r="5.5" fill="#123B56"/><circle cx="166" cy="66" r="2" fill="#fff"/><ellipse cx="146" cy="84" rx="6" ry="4" fill="#F3A69B"/><path d="M158 88q8 6 16-2" fill="none" stroke="#123B56" stroke-width="3.5" stroke-linecap="round"/></svg>`;
/* ---------- Estado (dados fictícios iniciais) ---------- */
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const seed=()=>({v:1,budget:5000,party:'2026-12-11',tab:'home',sub:'compras',cat:'Todos',q:'',
items:[['Arco de balões','Decoração',1,'Unidade',680,'orcado'],['100 copos descartáveis','Estrutura',100,'Unidade',48,'comprado'],['Bolo tema fundo do mar','Alimentação',1,'Unidade',420,'orcado'],['Lembrancinhas concha','Decoração',50,'Unidade',285,'comprado'],['Painel de fundo do mar','Decoração',1,'Unidade',350,'pesquisando'],['Fotógrafo','Serviços',1,'Serviço',600,'orcado'],['Mesas e cadeiras','Estrutura',1,'Kit',350,'comprado'],['Refrigerantes','Alimentação',24,'Unidade',160,'pesquisando']].map(a=>({id:uid(),name:a[0],cat:a[1],qty:a[2],unit:a[3],price:a[4],status:a[5]})),
recipes:[{id:uid(),n:'Bolo de chocolate',tag:'Preparar em casa',yield:'24 porções',e:'🎂',ing:[['Farinha de trigo','2 kg',14],['Açúcar refinado','1 kg',6.5],['Ovos','12 un.',24],['Chocolate em pó','500 g',32],['Leite','2 litros',12],['Fermento','1 un.',4]]},{id:uid(),n:'Brigadeiro de conchinha',tag:'Docinhos',yield:'100 unidades',e:'🍫',ing:[['Leite condensado','10 latas',72],['Chocolate em pó','400 g',18],['Manteiga','200 g',2.8]]},{id:uid(),n:'Sanduíche natural',tag:'Salgados',yield:'50 unidades',e:'🥪',ing:[['Pão de forma','10 pcts',65],['Frango desfiado','3 kg',60],['Requeijão','4 un.',20.2]]}],
deliv:[{id:uid(),n:'Lembrancinhas concha',s:'Ateliê Mar de Afeto',st:3,eta:day(1),frete:38},{id:uid(),n:'Topos de bolo personalizados',s:'Papelaria Fundo do Mar',st:1,eta:day(-3),frete:22},{id:uid(),n:'Painel de fundo do mar',s:'Loja Oceano',st:0,eta:day(9),frete:66}],
tasks:[{id:'a',t:'Fechar decoração',d:2,done:false},{id:'b',t:'Entrega das lembrancinhas',d:1,done:false},{id:'c',t:'Confirmar fotógrafo',d:0,done:true}],
guests:[['Marina e Paulo','Família Oliveira',2,'c'],['Ana Beatriz','Amigos da mamãe',0,'p'],['João e Camila','Família Souza',1,'c'],['Rafaela Martins','Trabalho',0,'p'],['Tio Carlos','Família Oliveira',3,'n'],['Dona Lúcia','Vizinhos',1,'c']].map(a=>({id:uid(),name:a[0],group:a[1],comp:a[2],st:a[3],phone:''})),
chat:[{r:'a',t:'Oi! Eu sou a Levi AI. Posso ajudar a planejar cada detalhe dessa aventura submarina. Por onde começamos?'}]});
let S;try{S=JSON.parse(localStorage.getItem('levi')||'null')}catch{}if(!S||S.v!==1)S=seed();
S.recipes.forEach(r=>{if(!r.id)r.id=uid()});S.deliv.forEach(d=>{if(!d.id)d.id=uid()});
let remoteReady=false,saveQueue=Promise.resolve();
async function writeRemote(snapshot){const response=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:snapshot});if(!response.ok){const result=await response.json().catch(()=>({}));throw new Error(result.error||'Falha ao salvar no Supabase.')} }
const save=()=>{const snapshot=JSON.stringify(S);try{localStorage.setItem('levi',snapshot)}catch(error){console.error('Local backup failed:',error);toast('Não foi possível salvar o backup neste aparelho.')}if(remoteReady)saveQueue=saveQueue.then(()=>writeRemote(snapshot)).catch(error=>{console.error('Cloud save failed:',error);toast('Erro ao salvar no Supabase. Confira sua conexão.')})};
const paidSt=['comprado','entregue'];
const STN={naopesq:'Não pesquisado',pesquisando:'Pesquisando preços',orcado:'Orçado',aguardando:'Aguardando compra',comprado:'Comprado',entregue:'Entregue',cancelado:'Cancelado'};
const CATS=['Alimentação','Decoração','Serviços','Estrutura','Outros'],UNITS=['Unidade','Pacote','Caixa','Kg','Gramas','Litro','Mililitro','Metro','Dúzia','Cento','Fardo','Kit','Serviço'];
const CI={Alimentação:'🍰',Decoração:'🎈',Serviços:'📸',Estrutura:'🪑',Outros:'🐚'};
const recCost=r=>r.ing.reduce((s,i)=>s+i[2],0);
const stats=()=>{const it=S.items.filter(i=>i.status!=='cancelado'),plan=it.reduce((s,i)=>s+(+i.price||0),0),paid=it.filter(i=>paidSt.includes(i.status)).reduce((s,i)=>s+(+i.price||0),0);
const rc=S.recipes.reduce((s,r)=>s+recCost(r),0),fr=S.deliv.reduce((s,d)=>s+d.frete,0),done=it.filter(i=>paidSt.includes(i.status)).length;
const conf=S.guests.filter(g=>g.st==='c').reduce((s,g)=>s+1+ +g.comp,0),tot=S.guests.reduce((s,g)=>s+1+ +g.comp,0);
return{plan:plan+rc,paid,rc,fr,done,n:it.length,conf,tot,pend:S.guests.filter(g=>g.st==='p').reduce((s,g)=>s+1+ +g.comp,0),no:S.guests.filter(g=>g.st==='n').reduce((s,g)=>s+1+ +g.comp,0),pct:it.length?Math.round(done/it.length*100):0}};
/* ---------- UI helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function confetti(){if(reduce)return;const cs=['#42BFC1','#F3A69B','#A8DFE8','#C9BDEB','#F4E8D0'];for(let i=0;i<26;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:50%;top:60%;background:${cs[i%5]};--x:${(Math.random()-.5)*320}px;--y:${-60-Math.random()*260}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function countUp(){document.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,m=el.dataset.m==='r';if(reduce){el.textContent=m?R(to):to;return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900),v=to*(1-Math.pow(1-p,3));el.textContent=m?R(v):Math.round(v);if(p<1)requestAnimationFrame(f)})(t0)})}
function bars(){requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%'))}
function modal(h){const m=document.createElement('div');m.className='mask';m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);const f=m.querySelector('input,textarea');f&&f.focus();return m}
const closeM=()=>document.querySelector('.mask')?.remove();
const emptyS=(t,s)=>`<div class="empty">${TURTLE}<b style="display:block;color:var(--ink)">${t}</b>${s}</div>`;
/* ---------- Telas ---------- */
const TABS=[['home','Início','<img class="nav-icon" src="/icons/octopus-home.png" alt="">'],['plan','Planejamento','<img class="nav-icon" src="/icons/octopus-planner.png" alt="">'],['budget','Orçamento','<img class="nav-icon" src="/icons/octopus-budget.png" alt="">'],['guests','Convidados','<img class="nav-icon" src="/icons/octopus-invite.png" alt="">'],['ai','Levi AI','<img class="nav-icon" src="/icons/octopus-ai.png" alt="">']];
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')" ${S.tab===t[0]?'aria-current="page"':''}><span>${t[2]}</span>${t[1]}</button>`).join('')}
function go(t){S.tab=t;save();render();scrollTo({top:0})}
function render(){nav();$('#ttl').textContent=TABS.find(t=>t[0]===S.tab)[1];$('#v').innerHTML=({home:home,plan:plan,budget:budget,guests:guests,ai:ai})[S.tab]();if(S.tab==='plan'&&S.sub==='compras')list();countUp();bars();if(S.tab==='ai')scrollTo({top:document.body.scrollHeight})}
function showLogin(message=''){remoteReady=false;$('#nav').style.display='none';$('#user-actions').style.display='none';$('#ttl').textContent='Acesso familiar';$('#v').innerHTML=`<div class="card" style="margin-top:24px"><div style="width:96px;height:96px;margin:0 auto 12px"><img class="page-art" src="/icons/octopus-home.png" alt=""></div><h1 style="text-align:center">Planejamento do Levi</h1><p class="sm" style="text-align:center;margin:8px 0 16px">Entre com a senha compartilhada da família para acessar e sincronizar os dados.</p><form onsubmit="login(event)"><label for="app-password">Senha compartilhada</label><input id="app-password" class="inp" type="password" autocomplete="current-password" required><button class="btn" style="width:100%">Entrar</button><p id="auth-message" class="sm" role="status" style="color:#C4574A;margin-top:10px">${esc(message)}</p></form></div>`}
function validState(data){return data&&data.v===1&&Array.isArray(data.items)&&Array.isArray(data.recipes)&&Array.isArray(data.deliv)&&Array.isArray(data.tasks)&&Array.isArray(data.guests)&&Array.isArray(data.chat)}
async function loadAppState(){const response=await fetch('/api/state');const result=await response.json();if(!response.ok){const error=new Error(result.error||'Não foi possível carregar os dados.');error.status=response.status;throw error}if(result.data){if(!validState(result.data))throw new Error('Os dados salvos têm um formato incompatível.');S=result.data}let changed=!result.data;if(S.party!=='2026-12-11'){S.party='2026-12-11';changed=true}S.recipes.forEach(r=>{if(!r.id){r.id=uid();changed=true}});S.deliv.forEach(d=>{if(!d.id){d.id=uid();changed=true}});remoteReady=true;if(changed)await writeRemote(JSON.stringify(S));try{localStorage.setItem('levi',JSON.stringify(S))}catch(error){console.error('Local backup failed:',error)}$('#nav').style.display='';$('#user-actions').style.display='flex';render()}
async function login(event){event.preventDefault();const button=event.currentTarget.querySelector('button');button.disabled=true;const password=$('#app-password').value;$('#auth-message').textContent='Conectando...';try{const response=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Não foi possível entrar.');await loadAppState()}catch(error){remoteReady=false;console.error('Login or sync failed:',error);$('#auth-message').textContent=error.message||'Falha ao conectar com o servidor.';button.disabled=false}}
async function resumeSession(){try{await loadAppState()}catch(error){if(error.status===401){showLogin();return}console.error('Session restore failed:',error);showLogin(error.message||'Não foi possível conectar com o servidor.')}}
async function logout(){try{await saveQueue;const response=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});if(!response.ok)throw new Error('Não foi possível encerrar a sessão.');showLogin('Você saiu da conta.')}catch(error){console.error('Logout failed:',error);toast(error.message||'Não foi possível sair.')}}

<div class="card"><div class="ic" style="background:#FDE5E1">🛒</div><div class="sm">Itens comprados</div><div class="n"><span data-n="${s.done}"></span> <span class="sm">/ ${s.n}</span></div><div class="sm">${s.n-s.done} ainda pendentes</div></div>

<div class="card"><div class="ic" style="background:#FBF0D3">🚚</div><div class="sm">Entregas</div><div class="n" data-n="${S.deliv.length}"></div><div class="sm">${S.deliv.filter(d=>d.st<4).length} a caminho</div></div></div>

${[['＋','Adicionar item','newItem()'],['<img src="/icons/octopus-invite.png" alt="">','Novo convidado','newGuest()'],['<img src="/icons/octopus-budget.png" alt="">','Registrar gasto',"go('budget')"],['✨','Conversar com Levi AI',"go('ai')"]].map(a=>`<button class="card" style="display:flex;gap:10px;align-items:center;font-weight:700;text-align:left;${a[0]==='✨'?'background:#EDE8FA':''}" onclick="${a[2]}"><span class="ic" style="background:#DDF3F0;margin:0;flex:none">${a[0]}</span>${a[1]}</button>`).join('')}</div>
<div class="card"><div class="sec" style="margin:0">FIQUE DE OLHO</div><h2 style="margin-bottom:6px">Próximos passos</h2>${S.tasks.map(t=>`<div class="row" onclick="tTask('${t.id}')" style="cursor:pointer"><div class="${t.done?'chk on':'dt'}" ${t.done?'':'style="background:#DDF3F0;color:#1F8F8A"'}>${t.done?'✓':t.d+'<small>DIAS</small>'}</div><div><b>${esc(t.t)}</b><span class="sm">${t.done?'Concluído':'Vence em '+t.d+' dias'}</span></div>${!t.done&&t.d<=2?'<span class="badge r">Urgente</span>':''}</div>`).join('')}</div>
<div class="card tip"><div style="width:84px;height:84px;flex:none"><img src="/icons/octopus-ai.png" alt="Polvo da Levi AI" class="page-art"></div><div style="flex:1"><div class="sec" style="margin:0">UMA DICA DA LEVI AI</div><h3 style="font-size:18px">Você pode economizar até ${R(save_)}</h3><p class="sm">Compare itens de decoração semelhantes com valores menores.</p></div><button class="fab" style="background:#fff;color:var(--deep);border-radius:50%;flex:none;font-size:18px" onclick="go('ai')" aria-label="Abrir Levi AI">›</button></div>`}
function tTask(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render();if(t.done){confetti();toast('Tarefa concluída! 🎉')}}
function plan(){const sub=S.sub;let h=`<div class="card" style="display:flex;align-items:center;background:linear-gradient(135deg,#E3F6F2,#EDF8F8)"><div style="flex:1"><div class="sec" style="margin:0">TUDO EM SEU LUGAR</div><h1 style="font-size:28px">Planejamento</h1><p class="sm">Organize compras, receitas e entregas sem perder nenhum detalhe.</p></div><div style="width:120px;height:120px;flex:none"><img class="page-art" src="/icons/octopus-planner.png" alt="Polvo organizando uma lista de tarefas"></div></div>

else if(sub==='receitas')h+=S.recipes.map(r=>`<div class="card rec"><div class="top"><span>${esc(r.tag)}</span>${esc(r.e)}</div><div class="bd"><h3 style="font-size:19px">${esc(r.n)}</h3><p class="sm">${esc(r.yield)} · ${r.ing.length} ingredientes</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><b style="font-size:17px">${R(recCost(r))}</b><button style="color:var(--tq);font-weight:700" onclick="this.closest('.rec').querySelector('.ings').classList.toggle('open');this.textContent=this.textContent.startsWith('Ver')?'Ocultar ingredientes ›':'Ver ingredientes ›'">Ver ingredientes ›</button></div><div class="ings"><div>${r.ing.map(g=>`<div class="row" style="padding:8px 0"><div style="flex:1">${esc(g[0])}</div><span class="sm">${esc(g[1])}</span><b style="width:70px;text-align:right">${R(g[2])}</b></div>`).join('')}<p class="sm" style="margin-top:8px">Por porção: ${R(recCost(r)/parseInt(r.yield))}</p></div></div><div class="row-actions" style="justify-content:flex-end;margin-top:12px"><button class="icon-btn" onclick="editRecipe('${r.id}')" aria-label="Editar receita">✎</button><button class="icon-btn danger" onclick="deleteRecipe('${r.id}')" aria-label="Excluir receita">🗑</button></div></div></div>`).join('')+`<button class="card" style="width:100%;border:2px dashed var(--ln);box-shadow:none;background:transparent;color:var(--mut)" onclick="newRecipe()"><b style="display:block;color:var(--ink)">＋ Nova receita</b>Calcule custos e ingredientes</button>`;
else{const D=['Aguardando envio','Enviado','Em trânsito','Saiu para entrega','Entregue'];h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px"><h2>Entregas</h2><button class="fab" onclick="newDelivery()" aria-label="Nova entrega">＋</button></div>`+(S.deliv.length?S.deliv.map(d=>{const late=d.st<4&&d.eta<day(0);return`<div class="card" ${late?'style="border:1.5px solid #F7C9C1"':''}><div style="display:flex;justify-content:space-between;gap:8px"><div><b style="font-size:16px">${esc(d.n)}</b><div class="sm">${esc(d.s)}</div></div><span class="badge ${late?'r':d.st===4?'':'y'}">${late?'Atrasado':D[d.st]}</span></div><div class="tl" style="margin-top:14px">${D.map((x,i)=>`<div class="${i>d.st?'w':''}"><b>${x}</b></div>`).join('')}</div><p class="sm">Previsto para ${new Date(d.eta+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · Frete ${R(d.frete)}</p><div class="row-actions" style="justify-content:flex-end"><button class="icon-btn" onclick="editDelivery('${d.id}')" aria-label="Editar entrega">✎</button><button class="icon-btn danger" onclick="deleteDelivery('${d.id}')" aria-label="Excluir entrega">🗑</button></div></div>`}).join(''):emptyS('Nenhuma entrega cadastrada','Toque em ＋ para adicionar uma entrega.'))}
return h}
function list(){const q=S.q.toLowerCase(),L=S.items.filter(i=>(S.cat==='Todos'||i.cat===S.cat)&&i.name.toLowerCase().includes(q));
$('#lst').innerHTML=`<div class="sm" style="display:flex;justify-content:space-between"><b>${S.cat==='Todos'?'Todos os itens':S.cat}</b><span>${L.length} itens · ${R(L.reduce((s,i)=>s+i.price,0))}</span></div>`+(L.length?L.map(i=>`<div class="row"><button class="chk ${paidSt.includes(i.status)?'on':''}" onclick="tItem('${i.id}')" aria-label="Marcar como comprado">${paidSt.includes(i.status)?'✓':''}</button><div><b>${esc(i.name)}</b><span class="sm">${CI[i.cat]||''} ${esc(i.cat)} · ${i.qty} ${esc(i.unit.toLowerCase())} · ${STN[i.status]}</span></div><b>${i.price?R(i.price):'—'}</b><div class="row-actions"><button class="icon-btn" onclick="editItem('${i.id}')" aria-label="Editar item">✎</button><button class="icon-btn danger" onclick="deleteItem('${i.id}')" aria-label="Excluir item">🗑</button></div></div>`).join(''):emptyS('Nada por aqui ainda','Adicione o primeiro item da festa.'))}
function tItem(id){const i=S.items.find(x=>x.id===id);i.status=paidSt.includes(i.status)?'aguardando':'comprado';save();list();if(i.status==='comprado'){confetti();toast('Item comprado! 🫧')}}
const GUESS=[[/copo|prato|talher|guardanapo|mesa|cadeira|bandeja/i,'Estrutura','Unidade'],[/bolo|salgad|doce|brigadeiro|beijinho|refri|suco|[áa]gua|gelo/i,'Alimentação','Unidade'],[/bal[ãa]o|painel|flor|enfeite|toalha|lembran/i,'Decoração','Unidade'],[/fot[óo]grafo|buffet|gar[çc]om|som|recrea/i,'Serviços','Serviço'],[/refri|suco|leite/i,'Alimentação','Litro']];
function newItem(id=''){const item=S.items.find(i=>i.id===id),status=item?.status||'naopesq';modal(`<div class="sec" style="margin:0">LISTA DE COMPRAS</div><h2 style="margin-bottom:12px">${item?'Editar item':'Novo item'}</h2>${item?'':'<div class="card tip" style="padding:10px;box-shadow:none;background:#E3F6F2">✨ <span class="sm">Digite "100 copos descartáveis" e sugerimos o restante.</span></div>'}<label>Nome do item</label><input id="fn" class="inp" placeholder="Ex.: 100 copos descartáveis" value="${esc(item?.name||'')}"><label>Categoria</label><select id="fc" class="inp">${CATS.map(c=>`<option value="${c}" ${item?.cat===c?'selected':!item&&c==='Outros'?'selected':''}>${c}</option>`).join('')}</select><label>Quantidade</label><input id="fq" class="inp" type="number" min="1" value="${item?.qty||1}"><label>Unidade</label><select id="fu" class="inp">${UNITS.map(c=>`<option ${item?.unit===c?'selected':''}>${c}</option>`).join('')}</select><label>Valor estimado</label><input id="fp" class="inp" type="number" min="0" step="0.01" value="${item?.price??''}" placeholder="R$ 0,00"><label>Status</label><select id="fs" class="inp">${Object.entries(STN).map(([v,label])=>`<option value="${v}" ${status===v?'selected':''}>${label}</option>`).join('')}</select><div class="form-actions"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveItem('${item?.id||''}')">✓ Salvar</button></div>`);
if(!item)$('#fn').oninput=e=>{const mm=e.target.value.match(/^(\d+)\s+(.+)/);if(mm)$('#fq').value=mm[1];const t=mm?mm[2]:e.target.value,g=GUESS.find(x=>x[0].test(t));if(g){$('#fc').value=g[1];$('#fu').value=g[2]}}}
function saveItem(id=''){const name=$('#fn').value.trim(),qty=Number($('#fq').value),price=Number($('#fp').value||0);if(!name){toast('Digite o nome do item');return}if(!Number.isFinite(qty)||qty<1||!Number.isFinite(price)||price<0){toast('Confira a quantidade e o valor');return}const item=S.items.find(i=>i.id===id);if(item)Object.assign(item,{name,cat:$('#fc').value,qty,unit:$('#fu').value,price,status:$('#fs').value});else S.items.unshift({id:uid(),name,cat:$('#fc').value,qty,unit:$('#fu').value,price,status:$('#fs').value});save();closeM();toast(item?'Item atualizado!':'Item salvo! 🐚');S.tab==='plan'?render():go('plan')}
function editItem(id){newItem(id)}
function deleteItem(id){const item=S.items.find(i=>i.id===id);if(!item||!confirm(`Excluir "${item.name}" da lista de compras?`))return;S.items=S.items.filter(i=>i.id!==id);save();render();toast('Item excluído.')}

function recipeModal(id=''){const recipe=S.recipes.find(r=>r.id===id);modal(`<div class="sec" style="margin:0">RECEITAS</div><h2 style="margin-bottom:12px">${recipe?'Editar receita':'Nova receita'}</h2><label>Nome</label><input id="rn" class="inp" value="${esc(recipe?.n||'')}" placeholder="Ex.: Bolo de chocolate"><label>Categoria ou etiqueta</label><input id="rt" class="inp" value="${esc(recipe?.tag||'')}" placeholder="Ex.: Preparar em casa"><label>Rendimento</label><input id="ry" class="inp" value="${esc(recipe?.yield||'')}" placeholder="Ex.: 24 porções"><label>Emoji</label><input id="re" class="inp" value="${esc(recipe?.e||'🍰')}" maxlength="8"><div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0"><b>Ingredientes</b><button type="button" class="btn s" onclick="addIngredient()">＋ Ingrediente</button></div><div id="ingredients">${(recipe?.ing||[]).map(ingredientRow).join('')}</div><div class="form-actions"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveRecipe('${recipe?.id||''}')">✓ Salvar receita</button></div>`);if(!recipe)addIngredient()}
function newRecipe(){recipeModal()}

function saveRecipe(id=''){const name=$('#rn').value.trim(),tag=$('#rt').value.trim(),yield=$('#ry').value.trim();if(!name||!yield){toast('Preencha o nome e o rendimento');return}const ing=[];let invalid=false;document.querySelectorAll('.ingredient-edit').forEach(row=>{const n=row.querySelector('.ri-name').value.trim(),q=row.querySelector('.ri-qty').value.trim(),p=row.querySelector('.ri-price').value;if(!n&&!q&&!p)return;const price=Number(p);if(!n||!q||!Number.isFinite(price)||price<0){invalid=true;return}ing.push([n,q,price])});if(invalid||!ing.length){toast('Preencha os ingredientes, quantidades e preços');return}const recipe=S.recipes.find(r=>r.id===id),data={n:name,tag:tag||'Receita',yield,e:$('#re').value.trim()||'🍰',ing};if(recipe)Object.assign(recipe,data);else S.recipes.unshift({id:uid(),...data});save();closeM();render();toast(recipe?'Receita atualizada!':'Receita salva!')}
function deleteRecipe(id){const recipe=S.recipes.find(r=>r.id===id);if(!recipe||!confirm(`Excluir a receita "${recipe.n}"?`))return;S.recipes=S.recipes.filter(r=>r.id!==id);save();render();toast('Receita excluída.')}
const DELIVERY_STATES=['Aguardando envio','Enviado','Em trânsito','Saiu para entrega','Entregue'];
function deliveryModal(id=''){const delivery=S.deliv.find(d=>d.id===id);modal(`<div class="sec" style="margin:0">ENTREGAS</div><h2 style="margin-bottom:12px">${delivery?'Editar entrega':'Nova entrega'}</h2><label>Item</label><input id="dn" class="inp" value="${esc(delivery?.n||'')}" placeholder="Ex.: Lembrancinhas"><label>Loja ou fornecedor</label><input id="ds" class="inp" value="${esc(delivery?.s||'')}" placeholder="Nome da loja"><label>Status</label><select id="dst" class="inp">${DELIVERY_STATES.map((state,index)=>`<option value="${index}" ${(delivery?.st??0)===index?'selected':''}>${state}</option>`).join('')}</select><label>Previsão de entrega</label><input id="de" class="inp" type="date" value="${delivery?.eta||''}" required><label>Frete (R$)</label><input id="df" class="inp" type="number" min="0" step="0.01" value="${delivery?.frete??0}"><div class="form-actions"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveDelivery('${delivery?.id||''}')">✓ Salvar entrega</button></div>`)}

function editDelivery(id){deliveryModal(id)}
function saveDelivery(id=''){const name=$('#dn').value.trim(),shop=$('#ds').value.trim(),eta=$('#de').value,frete=Number($('#df').value||0);if(!name||!shop||!eta){toast('Preencha o item, a loja e a previsão');return}if(!Number.isFinite(frete)||frete<0){toast('Confira o valor do frete');return}const delivery=S.deliv.find(d=>d.id===id),data={n:name,s:shop,st:Number($('#dst').value),eta,frete};if(delivery)Object.assign(delivery,data);else S.deliv.unshift({id:uid(),...data});save();closeM();render();toast(delivery?'Entrega atualizada!':'Entrega salva!')}
function deleteDelivery(id){const delivery=S.deliv.find(d=>d.id===id);if(!delivery||!confirm(`Excluir a entrega "${delivery.n}"?`))return;S.deliv=S.deliv.filter(d=>d.id!==id);save();render();toast('Entrega excluída.')}
function budget(){const s=stats(),by=CATS.map(c=>[c,S.items.filter(i=>i.cat===c&&i.status!=='cancelado').reduce((a,i)=>a+i.price,0)+(c==='Alimentação'?s.rc:0)]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),mx=by[0]?by[0][1]:1,avail=S.budget-s.plan,used=Math.min(100,s.plan/S.budget*100),C=2*Math.PI*40;
return`<div class="card bl"><div style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><div class="sm" style="color:#cfe">Orçamento disponível</div><div class="n" style="font-size:34px" data-n="${avail}" data-m="r"></div><div class="sm" style="color:#cfe">de ${R(S.budget)} planejados</div><div class="bar" style="margin-top:12px"><b data-w="${used}"></b></div><small>${Math.round(used)}% do orçamento comprometido</small></div><div class="budget-visual"><img src="/icons/octopus-budget.png" alt="Polvo guardando moedas em um cofrinho"><svg class="donut" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#ffffff33"/><circle cx="50" cy="50" r="40" stroke="#B5E5D6" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="${C*s.paid/S.budget} ${C}"/><text x="50" y="52" text-anchor="middle" fill="#fff" font-weight="800" font-size="19">${Math.round(s.paid/S.budget*100)}%</text><text x="50" y="66" text-anchor="middle" fill="#cfe" font-size="9">já pago</text></svg></div></div></div>
${avail<0?'<div class="card" style="background:#FDE5E1">⚠️ <b>Atenção:</b> o planejado passou do orçamento em '+R(-avail)+'.</div>':used>85?'<div class="card" style="background:#FBF0D3">⚠️ Mais de 85% do orçamento já está comprometido.</div>':''}
<div class="grid">${[['Total estimado',s.plan],['Efetivamente pago',s.paid],['Total pendente',s.plan-s.paid],['Fretes',s.fr]].map(x=>`<div class="card"><div class="sm">${x[0]}</div><div class="n" data-n="${x[1]}" data-m="r"></div></div>`).join('')}</div>
<div class="card"><div class="sec" style="margin:0">DISTRIBUIÇÃO</div><h2 style="margin-bottom:10px">Gastos por categoria</h2>${by.map(c=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${CI[c[0]]} ${c[0]}</span><b>${R(c[1])}</b></div><div class="bar d" style="margin-top:5px"><b data-w="${c[1]/mx*100}"></b></div></div>`).join('')}<p class="sm">Alimentação inclui o custo das receitas, sem duplicar ingredientes.</p></div>`}
function guests(){const s=stats(),f=S.gf||'t',L=S.guests.filter(g=>f==='t'||g.st===f),ST={c:['Confirmado',''],p:['Pendente','y'],n:['Não irá','r']},groups=[...new Set(L.map(g=>g.group))];
return`<div class="sec" style="margin:0">PESSOAS ESPECIAIS</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="flex:1"><h1 style="font-size:30px">Convidados</h1><p class="sm">Todo mundo que vai celebrar a chegada do Levi com vocês.</p></div><img src="/icons/octopus-invite.png" alt="Polvo preparando um convite" style="width:82px;height:88px;object-fit:contain;flex:none"><button class="fab" onclick="newGuest()" aria-label="Novo convidado">＋</button></div>
<div class="grid" style="margin-top:14px"><div class="card bl" style="grid-column:1/-1"><span class="sm" style="color:#cfe">Total de pessoas</span><div class="n" style="font-size:34px" data-n="${s.tot}"></div></div>${[['Confirmados',s.conf,'#5CCFA5'],['Pendentes',s.pend,'#EBB65A'],['Não irão',s.no,'#F3A69B']].map(x=>`<div class="card" style="padding:12px"><span class="sm"><span style="color:${x[2]}">●</span> ${x[0]}</span><div class="n" data-n="${x[1]}"></div></div>`).join('')}</div>
<div class="chips">${[['t','Todos'],['c','Confirmado'],['p','Pendente'],['n','Não irá']].map(x=>`<button class="chip ${f===x[0]?'on':''}" onclick="S.gf='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
${groups.length?groups.map(g=>`<div class="card"><b class="sm">${esc(g)}</b>${L.filter(x=>x.group===g).map(x=>`<div class="row" onclick="cycG('${x.id}')" style="cursor:pointer"><div class="av" style="width:40px;height:40px;font-size:13px;background:${['#DDF3F0','#EDE8FA','#FDE5E1','#FBF0D3'][x.name.length%4]}">${esc(x.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div><b>${esc(x.name)}</b><span class="sm">${x.comp?x.comp+' acompanhante'+(x.comp>1?'s':''):'Sem acompanhantes'}</span></div><span class="badge ${ST[x.st][1]}">${ST[x.st][0]}</span><div class="row-actions"><button class="icon-btn" onclick="event.stopPropagation();editGuest('${x.id}')" aria-label="Editar convidado">✎</button><button class="icon-btn danger" onclick="event.stopPropagation();deleteGuest('${x.id}')" aria-label="Excluir convidado">🗑</button></div></div>`).join('')}</div>`).join(''):emptyS('Nenhum convidado aqui','Toque em ＋ para convidar alguém.')}<p class="sm" style="text-align:center">Toque em um convidado para alterar o status.</p>`}
function cycG(id){const g=S.guests.find(x=>x.id===id);g.st={p:'c',c:'n',n:'p'}[g.st];save();render()}
function guestModal(id=''){const guest=S.guests.find(g=>g.id===id);modal(`<div class="sec" style="margin:0">PESSOAS ESPECIAIS</div><h2 style="margin-bottom:12px">${guest?'Editar convidado':'Novo convidado'}</h2><label>Nome do convidado</label><input id="gn" class="inp" value="${esc(guest?.name||'')}" placeholder="Ex.: Fernanda e família"><label>Telefone</label><input id="gt" class="inp" type="tel" value="${esc(guest?.phone||'')}" placeholder="(00) 00000-0000"><label>Grupo ou família</label><input id="gg" class="inp" value="${esc(guest?.group||'')}" placeholder="Ex.: Família Silva"><label>Acompanhantes</label><input id="ga" class="inp" type="number" min="0" value="${guest?.comp||0}"><label>Confirmação</label><select id="gs" class="inp"><option value="p" ${guest?.st==='p'?'selected':''}>Pendente</option><option value="c" ${guest?.st==='c'?'selected':''}>Confirmado</option><option value="n" ${guest?.st==='n'?'selected':''}>Não irá</option></select><div class="form-actions"><button class="btn s" onclick="closeM()">Cancelar</button><button class="btn" onclick="saveGuest('${guest?.id||''}')">✓ Salvar convidado</button></div>`)}
function newGuest(){guestModal()}
function editGuest(id){guestModal(id)}
function saveGuest(id=''){const name=$('#gn').value.trim(),companions=Number($('#ga').value);if(!name){toast('Digite o nome do convidado');return}if(!Number.isInteger(companions)||companions<0){toast('Confira o número de acompanhantes');return}const guest=S.guests.find(g=>g.id===id),data={name,phone:$('#gt').value.trim(),group:$('#gg').value.trim()||'Sem grupo',comp:companions,st:$('#gs').value};if(guest)Object.assign(guest,data);else S.guests.unshift({id:uid(),...data});save();closeM();render();toast(guest?'Convidado atualizado!':'Convidado adicionado! 🐠')}
function deleteGuest(id){const guest=S.guests.find(g=>g.id===id);if(!guest||!confirm(`Excluir "${guest.name}" da lista de convidados?`))return;S.guests=S.guests.filter(g=>g.id!==id);save();render();toast('Convidado excluído.')}
/* ---------- Levi AI ---------- */
const SUG=['Quantos salgados para 60 pessoas?','Como economizar na decoração?','O que ainda falta comprar?'];
function ai(){return`<div class="card" style="display:flex;gap:12px;align-items:center;padding:12px"><div style="width:48px;height:48px;background:#EDE8FA;border-radius:14px;padding:4px;flex:none"><img src="/icons/octopus-ai.png" alt="Polvo da Levi AI" class="page-art"></div><div><b>Levi AI</b><div class="sm">● Pronto para ajudar</div></div></div><div class="sec" style="margin:0 0 8px">EXPERIMENTE PERGUNTAR</div><div class="chips">${SUG.map(s=>`<button class="chip" onclick="ask(this.textContent)">${s}</button>`).join('')}</div><div class="chat" id="chat">${S.chat.map(msgH).join('')}</div><form class="cbar" onsubmit="event.preventDefault();ask($('#ci').value)"><input id="ci" class="inp" placeholder="Pergunte qualquer coisa sobre a festa..." aria-label="Mensagem" autocomplete="off"><button class="fab" style="background:var(--tq)" aria-label="Enviar">➤</button></form>`}
const msgH=m=>m.items?.length?`<div class="ac"><b>Sugestão de itens</b>${m.items.map(i=>`<div class="sm">• ${esc(i.qty||1)} ${esc(i.unit||'un.')} — ${esc(i.name)}${i.price?' ('+R(i.price)+')':''}</div>`).join('')}<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="padding:8px 14px" onclick="addAi('${m.id}')">Adicionar ${m.items.length} itens</button><button class="btn s" style="padding:8px 14px" onclick="this.closest('.ac').remove()">Agora não</button></div></div>`:`<div class="msg ${m.r==='u'?'u':''}">${esc(m.t)}</div>`;
async function ask(q){q=(q||'').trim();if(!q)return;S.chat.push({r:'u',t:q});S.chat.push({r:'a',t:'🫧 Pensando...',tmp:1});render();let a;
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,context:{orcamento:S.budget,planejado:stats().plan,pago:stats().paid,convidados:stats().tot,itens:S.items.map(i=>({n:i.name,c:i.cat,s:i.status,p:i.price}))}})});if(!r.ok)throw 0;a=await r.json()}catch{a=demo(q)}
S.chat=S.chat.filter(m=>!m.tmp);S.chat.push({r:'a',t:a.reply});if(a.items?.length)S.chat.push({r:'a',id:uid(),items:a.items});S.chat=S.chat.slice(-30);save();render()}
function demo(q){const n=(q.match(/\d+/)||[60])[0];if(/salgad/i.test(q))return{reply:`Modo demonstração (configure a GEMINI_API_KEY para respostas reais).\nPara ${n} convidados, calculo cerca de 8 salgados por pessoa: ${n*8} unidades (~${Math.ceil(n*8/100)} cento${n*8>100?'s':''}). Premissa: festa de 3 horas com doces e bolo também.`,items:[{name:'Salgados variados',cat:'Alimentação',qty:n*8,unit:'Unidade',price:Math.round(n*8*.55)}]};
if(/falta/i.test(q)){const p=S.items.filter(i=>!paidSt.includes(i.status));return{reply:p.length?`Ainda faltam ${p.length} itens: ${p.slice(0,4).map(i=>i.name).join(', ')}. Resolva primeiro a decoração, que vence em 2 dias.`:'Tudo comprado! 🎉',items:[]}}
if(/econom/i.test(q))return{reply:'Dicas: compare painéis em 3 lojas, alugue em vez de comprar mesas e faça os docinhos em casa. Isso costuma economizar de 10% a 15%.',items:[]};
return{reply:'Estou em modo demonstração. Pergunte sobre salgados, economia ou o que falta comprar. Com a chave do Gemini configurada, respondo qualquer coisa!',items:[]}}
function addAi(id){const m=S.chat.find(x=>x.id===id);m.items.forEach(i=>S.items.unshift({id:uid(),name:i.name,cat:CATS.includes(i.cat)?i.cat:'Outros',qty:+i.qty||1,unit:UNITS.includes(i.unit)?i.unit:'Unidade',price:+i.price||0,status:'naopesq'}));S.chat=S.chat.filter(x=>x!==m);S.chat.push({r:'a',t:'Pronto! Adicionei à sua lista de compras. 🐙'});save();confetti();render()}
/* ---------- Início ---------- */
const B=$('#bub');for(let i=0;i<14;i++){const e=document.createElement('i'),s=6+Math.random()*16;e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*15}s`;B.appendChild(e)}
setTimeout(()=>$('#splash').classList.add('out'),reduce?300:1900);setTimeout(()=>$('#splash').remove(),2800);
resumeSession();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
